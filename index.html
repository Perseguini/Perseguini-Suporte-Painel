<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perseguini Suporte IA</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="cabecalho-conteudo">
      <div>
        <h1>Perseguini Suporte IA</h1>
        <p>Painel do Técnico</p>
      </div>

      <button class="botao-atualizar-topo" onclick="carregarChamados()">
        Atualizar
      </button>
    </div>
  </header>

  <main>

    <section class="resumo">
      <div class="card-resumo">
        <span>Total de chamados</span>
        <strong id="totalChamados">0</strong>
      </div>

      <div class="card-resumo aguardando-card">
        <span>Aguardando humano</span>
        <strong id="aguardando">0</strong>
      </div>

      <div class="card-resumo atendimento-card">
        <span>Em atendimento</span>
        <strong id="emAtendimento">0</strong>
      </div>

      <div class="card-resumo resolvidos-card">
        <span>Resolvidos</span>
        <strong id="resolvidos">0</strong>
      </div>
    </section>

    <section>
      <div class="titulo-lista">
        <div>
          <h2>Chamados</h2>
          <p class="subtitulo">
            Atendimentos encaminhados pela IA para suporte humano
          </p>
        </div>

        <button class="botao-secundario" onclick="carregarChamados()">
          Atualizar lista
        </button>
      </div>

      <div class="filtros">
        <button class="filtro ativo" data-status="todos">
          Todos
        </button>

        <button class="filtro" data-status="aguardando_humano">
          Aguardando
        </button>

        <button class="filtro" data-status="em_atendimento">
          Em atendimento
        </button>

        <button class="filtro" data-status="resolvido">
          Resolvidos
        </button>
      </div>

      <div id="listaChamados">
        Carregando chamados...
      </div>
    </section>

  </main>

  <div id="modalChamado" class="modal oculto">
    <div class="modal-conteudo">

      <button class="fechar-modal" onclick="fecharModal()" aria-label="Fechar">
        ×
      </button>

      <div class="modal-cabecalho">
        <div>
          <span class="modal-legenda">Chamado</span>
          <h2>Detalhes do atendimento</h2>
        </div>

        <span id="modalStatus" class="status"></span>
      </div>

      <div class="grade-detalhes">
        <div class="detalhe">
          <strong>Cliente</strong>
          <span id="modalNumero"></span>
        </div>

        <div class="detalhe">
          <strong>Data</strong>
          <span id="modalData"></span>
        </div>
      </div>

      <div class="detalhe bloco">
        <strong>Problema informado</strong>
        <p id="modalProblema"></p>
      </div>

      <div class="detalhe bloco">
        <strong>Resumo da IA</strong>
        <pre id="modalResumo"></pre>
      </div>

      <div class="acoes-chamado">
        <button id="btnAssumir" class="botao-primario" onclick="assumirChamado()">
          Assumir atendimento
        </button>

        <button class="botao-secundario" onclick="mostrarResposta()">
          Responder cliente
        </button>

        <button id="btnResolver" class="botao-sucesso" onclick="resolverChamado()">
          Marcar como resolvido
        </button>
      </div>

      <div id="areaResposta" class="area-resposta oculto">
        <label for="mensagemTecnico">Mensagem para o cliente</label>

        <textarea
          id="mensagemTecnico"
          placeholder="Digite a mensagem que será enviada ao WhatsApp do cliente..."
        ></textarea>

        <div class="acoes-resposta">
          <button class="botao-secundario" onclick="ocultarResposta()">
            Cancelar
          </button>

          <button class="botao-primario" onclick="enviarResposta()">
            Enviar mensagem
          </button>
        </div>
      </div>

    </div>
  </div>

  <div id="toast" class="toast oculto"></div>

  <script src="script.js"></script>
</body>
</html>
